<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chloe Hemming</title>
<meta name="description" content="Chloe Hemming. UGC creator and bookish content. Romantasy and romance reviews, rated on vibes.">
<meta name="theme-color" content="#FBF7F5">

<meta property="og:type" content="profile">
<meta property="og:url" content="https://chloehemming.com/">
<meta property="og:title" content="Chloe Hemming">
<meta property="og:description" content="UGC creator and bookish content. Romantasy and romance reviews, rated on vibes.">
<meta property="og:image" content="https://chloehemming.com/chloe.jpg">
<meta name="twitter:card" content="summary">

<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:    #FBF7F5;
  --s1:    #FFFFFF;
  --s2:    #FFF3F6;
  --line:  #F0E2E6;
  --line2: #E6C9D2;
  --ink:   #2B2226;
  --ink70: rgba(43,34,38,.72);
  --ink45: rgba(43,34,38,.5);
  --pink:  #E59AB3;
  --pink2: #D9789A;
  --pinkbg:#FBE7EE;
  --fh:    'DM Serif Display', Georgia, serif;
  --fb:    'Nunito', system-ui, sans-serif;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--fb); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100svh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

main { width: 100%; max-width: 520px; margin: 0 auto; padding: 56px 20px 40px; flex: 1; }
@media (min-width: 600px) { main { padding-top: 80px; } }

/* profile */
.profile { text-align: center; }
.avatar { width: 128px; height: 128px; border-radius: 50%; overflow: hidden; margin: 0 auto 20px; border: 2px solid var(--pink); box-shadow: 0 0 0 5px var(--bg), 0 0 0 6px var(--line2); }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
@media (min-width: 600px) { .avatar { width: 144px; height: 144px; } }
.name { font-family: var(--fh); font-weight: 400; font-size: 36px; letter-spacing: .005em; line-height: 1; }
.bio { margin: 14px auto 0; max-width: 400px; color: var(--ink70); font-size: 15.5px; line-height: 1.6; }

/* cards */
.cards { margin-top: 36px; display: grid; gap: 12px; }
.card { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px; transition: border-color .2s, background .2s, transform .15s, box-shadow .2s; box-shadow: 0 1px 2px rgba(43,34,38,.03); }
.card:hover { border-color: var(--line2); background: var(--s2); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(217,120,154,.12); }
.card .txt { min-width: 0; }
.card .tag { display: inline-block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--pink2); font-weight: 700; margin-bottom: 6px; }
.card .txt strong { display: block; font-family: var(--fh); font-weight: 400; font-size: 21px; line-height: 1.15; }
.card .txt span { display: block; color: var(--ink45); font-size: 14px; margin-top: 4px; line-height: 1.45; }
.card .arrow { color: var(--pink2); font-size: 18px; transition: transform .2s; }
.card:hover .arrow { transform: translateX(3px); }
.card.featured { background: var(--pinkbg); border-color: var(--line2); }
.card.featured:hover { background: #F9DDE7; }

/* socials */
.socials { margin-top: 32px; display: flex; justify-content: center; gap: 12px; }
.socials a { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line2); background: var(--s1); display: flex; align-items: center; justify-content: center; transition: border-color .2s, background .2s; }
.socials a:hover { border-color: var(--pink); background: var(--pinkbg); }
.socials img { width: 18px; height: 18px; opacity: .8; }

footer { text-align: center; padding: 24px 20px 32px; font-size: 12px; color: var(--ink45); letter-spacing: .04em; }
</style>
</head>
<body>
<main>
  <section class="profile">
    <div class="avatar"><img src="chloe.jpg" alt="Chloe Hemming" width="600" height="600"></div>
    <h1 class="name">Chloe Hemming</h1>
    <p class="bio">UGC creator and bookish content.<br>Romantasy and romance, rated on vibes.</p>
  </section>

  <section class="cards">
    <a class="card featured" href="#" rel="noopener">
      <div class="txt"><span class="tag">UGC</span><strong>Work with me</strong><span>Placeholder. UGC portfolio and how to book.</span></div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="https://www.goodreads.com/user/show/179375088" target="_blank" rel="noopener">
      <div class="txt"><span class="tag">Books</span><strong>What I'm reading</strong><span>Placeholder. Reviews and the 2026 book count on Goodreads.</span></div>
      <span class="arrow">→</span>
    </a>
  </section>

  <section class="socials" aria-label="Social links">
    <a href="https://www.instagram.com/chloejmhemming" target="_blank" rel="noopener" aria-label="Instagram"><img src="https://cdn.jsdelivr.net/npm/simple-icons@13.0.0/icons/instagram.svg" alt="" width="18" height="18"></a>
    <a href="https://www.tiktok.com/@chloejmhemming" target="_blank" rel="noopener" aria-label="TikTok"><img src="https://cdn.jsdelivr.net/npm/simple-icons@13.0.0/icons/tiktok.svg" alt="" width="18" height="18"></a>
    <a href="https://www.goodreads.com/user/show/179375088" target="_blank" rel="noopener" aria-label="Goodreads"><img src="https://cdn.jsdelivr.net/npm/simple-icons@13.0.0/icons/goodreads.svg" alt="" width="18" height="18"></a>
  </section>
</main>
<footer>© 2026 Chloe Hemming</footer>
</body>
</html>
